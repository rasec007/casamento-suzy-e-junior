<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Acesso dos noivos — Nosso Casamento</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/landing.css"><link rel="stylesheet" href="/acesso.css"><script type="module" src="/acesso.js"></script></head>
<body><header><div class="container nav"><a class="logo" href="/">Nosso Casamento</a><a href="/" class="back-link">← Voltar ao início</a></div></header><main class="access-wrap"><section class="access-card"><p class="eyebrow">PAINEL DOS NOIVOS</p><h1>Acesso ao seu casamento</h1><p class="access-intro">Entrem para cuidar de todos os detalhes do grande dia.</p><form id="login-form" class="access-form"><label>E-mail<input name="email" type="email" required maxlength="254" autocomplete="username"></label><label>Senha<input name="password" type="password" required maxlength="200" autocomplete="current-password"></label><div id="wedding-choice"></div><button type="submit" class="btn btn-primary">Entrar no painel</button><p class="access-status" id="login-status" role="status"></p></form><div class="register-area"><p>Ainda não têm um site?</p><button type="button" id="show-register" class="btn btn-primary register-button" aria-expanded="false" aria-controls="register-form">Criar site e acesso do casamento</button><form id="register-form" class="access-form" hidden><label>Nome do casal<input name="title" required maxlength="180" placeholder="Ex.: Ana & Paulo"></label><label>Endereço do casamento<input name="slug" required maxlength="80" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="ana-e-paulo" autocomplete="off"><small>O endereço será /casamento/nome-do-casal.</small></label><label>Nome de usuário<input name="username" required autocomplete="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9._-]{3,40}"></label><label>E-mail<input name="email" type="email" required maxlength="254" autocomplete="email"></label><label>Senha (mínimo 12 caracteres)<input name="password" type="password" required minlength="12" maxlength="200" autocomplete="new-password"></label><button type="submit" class="btn btn-primary">Criar casamento</button><p class="access-status" id="register-status" role="status"></p></form></div></section></main></body></html>
