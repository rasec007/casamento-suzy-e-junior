<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Casamento não encontrado</title>
  <link rel="stylesheet" href="/not-found.css">
  <script src="/not-found.js" defer></script>
</head>
<body>
  <main class="not-found-card">
    <p class="eyebrow">ENDEREÇO DO CASAMENTO</p>
    <h1>Este casamento não está cadastrado neste endereço</h1>
    <p>Confira o endereço compartilhado pelos noivos. Cada site usa um slug próprio depois de <code>/casamento/</code>.</p>
    <form id="site-url-form">
      <label for="site-url">Digite a URL do site ou o slug do casamento</label>
      <input id="site-url" name="siteUrl" type="text" required autocomplete="url" spellcheck="false" placeholder="https://seusite.com.br/casamento/nome-do-casal">
      <div class="form-actions">
        <button type="submit" name="destination" value="site">Acessar site</button>
        <button type="button" id="show-admin-login" class="panel-button">Acessar painel dos noivos</button>
      </div>
      <p id="url-status" role="status" aria-live="polite"></p>
    </form>
    <form id="admin-login-form" class="admin-login-form" hidden>
      <h2>Acesso dos noivos</h2>
      <label for="admin-email">E-mail</label>
      <input id="admin-email" name="email" type="email" required autocomplete="username" maxlength="254">
      <label for="admin-password">Senha</label>
      <input id="admin-password" name="password" type="password" required autocomplete="current-password" maxlength="200">
      <div id="wedding-choice"></div>
      <button type="submit">Entrar no painel</button>
      <p id="login-status" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
