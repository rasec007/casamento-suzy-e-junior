<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Casamento não encontrado</title>
  <link rel="stylesheet" href="/not-found.css">
  <script src="/not-found.js" defer></script>
</head>
<body>
  <main class="not-found-card">
    <p class="eyebrow">ENDEREÇO DO CASAMENTO</p>
    <h1>Este casamento não está cadastrado neste endereço</h1>
    <p>Confira o endereço compartilhado pelos noivos. Cada site usa um slug próprio depois de <code>/casamento/</code>.</p>
    <form id="site-url-form">
      <label for="site-url">Digite a URL do site ou o slug do casamento</label>
      <input id="site-url" name="siteUrl" type="text" required autocomplete="url" spellcheck="false" placeholder="https://seusite.com.br/casamento/nome-do-casal">
      <button type="submit">Acessar site</button>
      <p id="url-status" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
